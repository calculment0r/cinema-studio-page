*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;display:grid;place-items:center;

.lbl{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
h1{margin:0;font-weight:500;font-size:22px;line-height:1.25}
p{margin:0;font-size:14px;color:var(--ink2);line-height:1.5}
.champ{display:flex;box-shadow:inset 0 0 0 1px var(--line);background:var(--panel)}
input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;padding:12px 14px}
input:focus{outline:none}
.champ:focus-within{box-shadow:inset 0 0 0 1.5px var(--or)}
button{border:0;background:var(--or);color:var(--on-or);font:inherit;font-weight:600;font-size:13px;letter-spacing:.06em;padding:0 18px;cursor:pointer}
.err{color:var(--or);min-height:20px}

const CLE = 'cinema-studio-mdp';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ouvrir(mdp) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(PAQUET.sel), iterations: PAQUET.tours, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(PAQUET.iv)}, cle, b64(PAQUET.data));
  return new TextDecoder().decode(clair);
}
function afficher(html) {
  const ancre = location.hash;
  document.open(); document.write(html); document.close();
  if (ancre.length > 1) setTimeout(() => { const el = document.getElementById(decodeURIComponent(ancre.slice(1))); if (el) el.scrollIntoView(); }, 300);
}
async function essayer(mdp, retenu) {
  try {
    const html = await ouvrir(mdp);
    try { localStorage.setItem(CLE, mdp); } catch (e) {}
    afficher(html);
  } catch (e) {
    if (retenu) { try { localStorage.removeItem(CLE); } catch (x) {} return; }
    document.getElementById('err').textContent = 'Ce n\'est pas le bon mot de passe.';
  }
}
document.getElementById('porte').addEventListener('submit', ev => { ev.preventDefault(); essayer(document.getElementById('mdp').value, false); });
let retenu = null;
try { retenu = localStorage.getItem(CLE); } catch (e) {}
if (retenu) essayer(retenu, true); else document.getElementById('mdp').focus();
})();
</script>
